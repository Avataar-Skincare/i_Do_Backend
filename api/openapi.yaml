        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentVerifyRequest'
            example:
              razorpayOrderId: order_PZ3kTestOrd01
              razorpayPaymentId: pay_PZ3kTestPay01
              razorpaySignature: 9f2c0000example
      responses:
        '200':
          description: The order after verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                confirmed:
