  /orders/{id}/cancel:
    post:
      tags: [Cancel & refunds]
      operationId: cancelOrder
      summary: Cancel my order (before the ring ships)
      description: |
        Allowed in confirmed, kit_shipped, kit_delivered, size_submitted. Refund maths per LLD §3.3 (credit note issued
        automatically). In kit_shipped the cancel becomes an RTO request (outcome `rto_requested`). A COD refund needs
        `destination` and a step-up OTP. A reserved ring is released.
      x-lld: N
      security:
        - customerCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
            examples:
              prepaid:
                value:
                  reason: Changed my mind
              cod:
                value:
                  reason: Bought one elsewhere
                  destination:
                    type: upi
                    upiId: kavya.example@okx
      responses:
        '200':
          description: Cancelled (or RTO requested)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResponse'
              examples:
                cancelled:
                  $ref: '#/components/examples/CancelResponse'
        '400':
          description: Bad UPI id / IFSC, or validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                UPI_INVALID:
                  value:
                    statusCode: 400
                    message: That UPI ID doesn't look right.
                    code: UPI_INVALID
                IFSC_INVALID:
                  value:
                    statusCode: 400
                    message: That IFSC code doesn't look right.
                    code: IFSC_INVALID
        '401':
          description: Not logged in, or a destination was sent without a fresh step-up OTP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                STEP_UP_REQUIRED:
                  value:
                    statusCode: 401
                    message: Please confirm with the OTP we just sent.
                    code: STEP_UP_REQUIRED
                UNAUTHORIZED:
                  value:
                    statusCode: 401
                    message: Please log in again.
                    code: UNAUTHORIZED
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The ring has shipped (or the order is already cancelled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NOT_CANCELLABLE:
                  value:
                    statusCode: 409
                    message: Your ring has already shipped, so this order can't be cancelled.
                    code: NOT_CANCELLABLE
