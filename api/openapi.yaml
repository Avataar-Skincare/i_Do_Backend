                  value:
                    statusCode: 400
                    message: We couldn't verify this payment.
                    code: SIGNATURE_INVALID
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{id}/size:
    post:
      tags: [Size]
      operationId: submitSize
      summary: Submit the ring size once (locks it)
      description: |
        Only while the order is `kit_delivered` (accepted any time, also after sizeDueAt). Show the confirmation
        "You're choosing US 9. This can't be changed later." first and send `confirmed: true`.
        Reserves a ring of (finish, usSize) or puts the order on the backorder list — invisible to the customer.
      x-lld: N
      security:
        - customerCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SizeRequest'
            example:
              usSize: 8
              confirmed: true
      responses:
        '200':
          description: Size locked; order is now size_submitted
          content:
