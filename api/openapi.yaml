  # =====================================================================
  # Webhooks (server-to-server)
  # =====================================================================
  /webhooks/razorpay:
    post:
      tags: [Webhooks]
      operationId: razorpayWebhook
      summary: Razorpay events (source of truth for payments)
      description: |
        Raw body HMAC (RAZORPAY_WEBHOOK_SECRET, constant-time). Stored in payment_events (UNIQUE x-razorpay-event-id).
        Handles payment.captured, order.paid, payment.failed (logged) and refund.processed. 200 once stored; processing
        errors are retried by payment_sweep. No X-Requested-With (not a browser call).
      x-internal: true
      x-lld: N
      security:
        - razorpaySignature: []
      parameters:
        - name: x-razorpay-event-id
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, payload]
              properties:
                event:
                  type: string
                  enum: [payment.captured, order.paid, payment.failed, refund.processed]
                payload:
                  type: object
            example:
              event: payment.captured
              payload:
                payment:
                  entity:
                    id: pay_PZ3kTestPay01
                    order_id: order_PZ3kTestOrd01
                    amount: 1499900
                    currency: INR
                    status: captured
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received:
                    type: boolean
              examples:
                ack:
                  $ref: '#/components/examples/WebhookAck'
        '400':
          description: Bad signature.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                SIGNATURE_INVALID:
                  value:
                    statusCode: 400
                    message: Invalid signature
                    code: SIGNATURE_INVALID
  /webhooks/threads:
    post:
      tags: [Webhooks]
      operationId: threadsWebhook
      security: []
      summary: (Later — not live at launch) Threads WhatsApp button replies and delivery statuses
      description: Needs the i do Threads workspace and its event webhook (TD-11/12, parked). Signed; accepts only `COD_YES:{orderId}` / `COD_NO:{orderId}` button payloads and delivery statuses.
      x-internal: true
      x-lld: N (later)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: string
                  examples: ['COD_YES:IDO-5R7D2K9Q3T']
            example:
              payload: COD_YES:IDO-5R7D2K9Q3T
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received:
                    type: boolean
              examples:
                ack:
                  $ref: '#/components/examples/WebhookAck'
        '400':
          description: Bad signature.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                SIGNATURE_INVALID:
                  value:
                    statusCode: 400
                    message: Invalid signature
                    code: SIGNATURE_INVALID
components:
  securitySchemes:
    customerCookie:
      type: apiKey
      in: cookie
      name: ido_at
      description: Website access token (ES256 JWT, 15 min). HttpOnly, Secure, SameSite=Lax, host-only on api.idowellness.ai, Path=/.
    customerRefreshCookie:
      type: apiKey
      in: cookie
      name: ido_rt
      description: Website refresh token (60 days, rotated on every use). Path=/auth, so it is only sent to /auth/*.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Mobile app access token (kept in SecureStore). No cookies on the app.
    opsCookie:
      type: apiKey
      in: cookie
      name: ido_ops_at
      description: Staff access token, JWT aud=ops. The only credential `/admin/*` accepts.
    opsRefreshCookie:
      type: apiKey
      in: cookie
      name: ido_ops_rt
      description: Staff refresh token (12-hour session).
    partnerApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: partner-app-server key, compared in constant time. Actor recorded as `partner`.
    razorpaySignature:
      type: apiKey
      in: header
      name: x-razorpay-signature
      description: HMAC-SHA256 of the raw body with RAZORPAY_WEBHOOK_SECRET.

  parameters:
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: true
      description: CSRF guard. Required on every state-changing request; missing or wrong value → 403 `FORBIDDEN`.
      schema:
        type: string
        enum: [ido]
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A UUID generated once per checkout attempt. Retrying (for example after the Razorpay widget is closed) with the same key returns the same pending order instead of creating a new one.
      schema:
        type: string
        format: uuid
    XClient:
      name: X-Client
      in: header
      required: false
      description: Send `app` from the mobile app to receive tokens in the body instead of cookies. Omit on the website.
      x-decision: "v1.0.0 (20 Oct): the app sends X-Client: app and receives tokens in the response body instead of cookies."
      schema:
        type: string
        enum: [web, app]
    OrderId:
      name: id
      in: path
      required: true
      description: Order id, `IDO-` + 10 Crockford base32 characters.
      schema:
        $ref: '#/components/schemas/OrderId'
    ShipmentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RefundId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClaimId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConsultId:
      name: id
      in: path
      required: true
      description: Consult id (`c_` + random).
      schema:
        type: string
        maxLength: 40
    CreditNoteId:
      name: cnId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      description: 1-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50

  headers:
    SetCookieCustomer:
      description: '`ido_at` (Path=/, 15 min) and `ido_rt` (Path=/auth, 60 days). HttpOnly; Secure; SameSite=Lax; no Domain.'
      schema:
        type: string
    SetCookieOps:
      description: '`ido_ops_at` and `ido_ops_rt` (aud=ops, 12-hour session). HttpOnly; Secure; SameSite=Lax; no Domain.'
      schema:
        type: string
    RetryAfter:
      description: Seconds until another OTP may be requested.
      schema:
        type: integer

  responses:
    ValidationFailed:
      description: Body or query failed validation (unknown fields are rejected too).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            VALIDATION_FAILED:
              value:
                statusCode: 400
                message: ['pin must be exactly 6 digits']
                code: VALIDATION_FAILED
    Unauthorized:
      description: No valid session (missing or expired access token).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            UNAUTHORIZED:
              value:
                statusCode: 401
                message: Please log in again.
                code: UNAUTHORIZED
    Forbidden:
      description: Missing `X-Requested-With`, wrong origin, or (admin) not a staff token with aud=ops.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            FORBIDDEN:
              value:
                statusCode: 403
                message: Forbidden
                code: FORBIDDEN
    NotFound:
      description: Not found, or not yours (owner-only resources never reveal that they exist).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            NOT_FOUND:
              value:
                statusCode: 404
                message: Not found
                code: NOT_FOUND
    InvalidTransition:
      description: The record is not in a state that allows this action (guarded update matched 0 rows).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            INVALID_TRANSITION:
              value:
                statusCode: 409
                message: This order can't do that right now.
                code: INVALID_TRANSITION
    StepUpRequired:
      description: A fresh OTP (POST /auth/step-up) is needed first.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            STEP_UP_REQUIRED:
              value:
                statusCode: 401
                message: Please confirm with the OTP we just sent.
                code: STEP_UP_REQUIRED
  schemas:
    Error:
      type: object
      required: [statusCode, message, code]
      properties:
        statusCode:
          type: integer
          examples: [409]
        message:
          description: Human-readable; may be an array of strings for validation errors. Show it, but branch on `code`.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        code:
          $ref: '#/components/schemas/ErrorCode'
    ErrorCode:
      type: string
      description: |
        Stable machine-readable error code.
        From LLD §5: OTP_RATE_LIMIT, NOT_STAFF, ACCOUNT_HAS_OPEN_ORDER, STORE_NOT_LIVE, COD_NOT_SERVICEABLE,
        GSTIN_INVALID, SIGNATURE_INVALID, SIZE_LOCKED, INVALID_TRANSITION, NOT_CANCELLABLE, UPI_INVALID,
        IFSC_INVALID, STEP_UP_REQUIRED, INVOICE_NOT_READY, CLAIM_WINDOW_CLOSED, CLAIM_OPEN, FILE_TOO_LARGE,
        TOO_MANY_FILES, VIDEO_REQUIRED, PHOTO_REQUIRED, NOT_ELIGIBLE, ALREADY_BOOKED, DATE_OUTSIDE_WINDOW.
        Generic: VALIDATION_FAILED (400), UNAUTHORIZED (401), FORBIDDEN (403), NOT_FOUND (404).
        Added by this contract for rules the LLD states without naming a code: OTP_INVALID (wrong/expired/burned
        OTP), EMAIL_IN_USE (register), CONSENT_REQUIRED (consult booking needs health consent, §9),
        SETTING_READ_ONLY (PATCH /admin/settings on a read-only key).
      enum:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - OTP_INVALID
        - OTP_RATE_LIMIT
        - NOT_STAFF
        - EMAIL_IN_USE
        - ACCOUNT_HAS_OPEN_ORDER
        - STORE_NOT_LIVE
        - COD_NOT_SERVICEABLE
        - GSTIN_INVALID
        - SIGNATURE_INVALID
        - SIZE_LOCKED
        - INVALID_TRANSITION
        - NOT_CANCELLABLE
        - UPI_INVALID
        - IFSC_INVALID
        - STEP_UP_REQUIRED
        - INVOICE_NOT_READY
        - CLAIM_WINDOW_CLOSED
        - CLAIM_OPEN
        - FILE_TOO_LARGE
        - TOO_MANY_FILES
        - VIDEO_REQUIRED
        - PHOTO_REQUIRED
        - NOT_ELIGIBLE
        - ALREADY_BOOKED
        - DATE_OUTSIDE_WINDOW
        - CONSENT_REQUIRED
        - SETTING_READ_ONLY
    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string

    # ---------- primitives ----------
    OrderId:
      type: string
      pattern: '^IDO-[0-9A-HJKMNP-TV-Z]{10}$'
      description: '`IDO-` + 10 crypto-random Crockford base32 characters.'
    Paise:
      type: integer
      minimum: 0
      description: Integer paise (₹1 = 100).
    Finish:
      type: string
      enum: [gold, silver, black]
    UsSize:
      type: integer
      minimum: 6
      maximum: 13
    Phone:
      type: string
      pattern: '^\d{10}$'
      description: 10-digit Indian mobile number, no +91.
    Gstin:
      type: string
      maxLength: 15
      pattern: '^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$'
    OrderStatus:
      type: string
      description: |
        The 9 order states (LLD §3.1). `pending_payment` orders are never listed in Account → Orders.
      enum:
        - pending_payment
        - cod_pending
        - confirmed
        - kit_shipped
        - kit_delivered
        - size_submitted
        - ring_shipped
        - ring_delivered
        - cancelled
    CancelReason:
      type: string
      description: Set if and only if status = cancelled.
      enum: [unpaid, cod_unconfirmed, customer, kit_rto, ring_refused, admin]
    PaymentMethod:
      type: string
      enum: [online, cod]
    ShipmentKind:
      type: string
      enum: [kit, ring, replacement]
    ShipmentStatus:
      type: string
      enum: [pending, shipped, delivered, rto, lost]
    RtoReason:
      type: string
      enum: [refused, undeliverable]
    ReturnCondition:
      type: string
      enum: [sealed, damaged]
    RefundReason:
      type: string
      enum: [customer_cancel, kit_rto, ring_refused, late_capture, admin]
    RefundMethod:
      type: string
      enum: [razorpay, bank, upi]
    RefundStatus:
      type: string
      description: requested → processing → paid; rejected from requested or processing. (No awaiting_return, TD-26.)
      enum: [requested, processing, paid, rejected]
    ClaimKind:
      type: string
      enum: [damaged, wrong_item, warranty_defect]
    ClaimStatus:
      type: string
      enum: [draft, submitted, approved, rejected, replaced]
    ConsultType:
      type: string
      enum: [derm, dietician]
    ConsultStatus:
      type: string
      enum: [PENDING, CONFIRMED, COMPLETED, CANCELLED]
    EntitlementState:
      type: string
      description: Derived in this order — used (a COMPLETED consult) → booked (PENDING/CONFIRMED) → expired (now > expiresAt) → available.
      enum: [available, booked, used, expired]
    CodConfirmVia:
      type: string
      enum: [whatsapp_manual, whatsapp_auto, call]

    # ---------- shared objects ----------
    Customer:
      type: object
      description: Contact snapshot stored on the order.
      required: [name, email, phone]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
        phone:
          $ref: '#/components/schemas/Phone'
    Address:
      type: object
      required: [line, city, state, pin]
      properties:
        line:
          type: string
          minLength: 1
        city:
          type: string
          minLength: 1
        state:
          type: string
          minLength: 1
          description: Delivery state; also the GST place of supply.
        pin:
          type: string
          pattern: '^\d{6}$'
    User:
      type: object
      required: [id, email, phone, fullName, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: [string, 'null']
          format: email
        phone:
          type: [string, 'null']
        fullName:
          type: [string, 'null']
        role:
          type: string
          enum: [user, admin]
          description: '`admin` = staff (ops allow-list).'
        createdAt:
          type: string
          format: date-time
        emailVerifiedAt:
          type: [string, 'null']
          format: date-time
        phoneVerifiedAt:
          type: [string, 'null']
          format: date-time
        termsVersion:
          type: [string, 'null']
          maxLength: 16
        healthConsentAt:
          type: [string, 'null']
          format: date-time
        healthConsentVersion:
          type: [string, 'null']
          maxLength: 16
        healthConsentWithdrawnAt:
          type: [string, 'null']
          format: date-time
    AuthSession:
      type: object
      description: Website and ops get `{user}` plus Set-Cookie. The app (X-Client app) also gets the tokens in the body.
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
          description: App only.
        refreshToken:
          type: string
          description: App only.
        accessTokenExpiresAt:
          type: string
          format: date-time
          description: App only.

    Catalog:
      type: object
      required: [pricePaise, listPricePaise, kitIncluded, codFeePaise, codEnabled, finishes, offer, socialProof]
      properties:
        pricePaise:
          $ref: '#/components/schemas/Paise'
        listPricePaise:
          $ref: '#/components/schemas/Paise'
        kitIncluded:
          type: boolean
          description: Always true — "Sizing kit included with your ring".
        codFeePaise:
          $ref: '#/components/schemas/Paise'
        codEnabled:
          type: boolean
        finishes:
          type: array
          items:
            type: object
            required: [id, name, sizes]
            properties:
              id:
                $ref: '#/components/schemas/Finish'
              name:
                type: string
              sizes:
                type: array
                description: Read-only grid US 6–13. inStock=false → show "ships later". Not selectable at checkout.
                items:
                  type: object
                  required: [us, inStock]
                  properties:
                    us:
                      $ref: '#/components/schemas/UsSize'
                    inStock:
                      type: boolean
                      description: available (onHand − reserved) ≥ 1.
        offer:
          type: object
          required: [enabled]
          properties:
            enabled:
              type: boolean
              description: Launch offer slot; off at launch.
        socialProof:
          type: boolean
          description: social_proof_enabled switch ("30,000+ women", ratings).
    QuoteRequest:
      type: object
      required: [finish, paymentMethod, pin]
      properties:
        finish:
          $ref: '#/components/schemas/Finish'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        pin:
          type: string
          pattern: '^\d{6}$'
        offerCode:
          type: string
          maxLength: 32
    Quote:
      type: object
      description: Server-computed totals. total = subtotal + codFee − discount. Display only; POST /orders re-quotes.
      required: [subtotal, codFee, discount, total, codAvailable]
      properties:
        subtotal:
          $ref: '#/components/schemas/Paise'
        codFee:
          $ref: '#/components/schemas/Paise'
        discount:
          $ref: '#/components/schemas/Paise'
        total:
          $ref: '#/components/schemas/Paise'
        codAvailable:
          type: boolean
        codReason:
          type: string
          description: Present when codAvailable is false.
          enum: [cod_disabled, pincode_not_serviceable]

    # ---------- orders ----------
    Shipment:
      type: object
      required: [id, kind, status, attempt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ShipmentKind'
        claimId:
          type: [string, 'null']
          format: uuid
          description: Set only on kind=replacement.
        skuId:
          type: string
          maxLength: 32
          examples: [ring-gold-8]
        status:
          $ref: '#/components/schemas/ShipmentStatus'
        courier:
          type: [string, 'null']
          maxLength: 32
        awb:
          type: [string, 'null']
          maxLength: 40
        trackingUrl:
          type: [string, 'null']
          format: uri
        serialNumber:
          type: [string, 'null']
          maxLength: 40
        codAmount:
          $ref: '#/components/schemas/Paise'
        codCollectedAt:
          type: [string, 'null']
          format: date-time
        attempt:
          type: integer
          minimum: 1
          maximum: 2
        rtoReason:
          oneOf:
            - $ref: '#/components/schemas/RtoReason'
            - type: 'null'
        returnedAt:
          type: [string, 'null']
          format: date-time
          description: Set when an RTO parcel is physically back at the warehouse.
        returnCondition:
          oneOf:
            - $ref: '#/components/schemas/ReturnCondition'
            - type: 'null'
        shippedAt:
          type: [string, 'null']
          format: date-time
        deliveredAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    Refund:
      type: object
      description: amount = amountPaid − kitDeduction − feeDeduction, fixed at creation.
      required: [id, orderId, reason, amountPaid, kitDeduction, feeDeduction, amount, method, status, destinationRequired, createdAt]
      x-decision: "v1.0.0 (20 Oct): clients branch on destinationRequired; refunds.method becomes nullable in migration M21 until the customer gives UPI/bank details."
      properties:
        id:
          type: string
          format: uuid
        orderId:
          $ref: '#/components/schemas/OrderId'
        reason:
          $ref: '#/components/schemas/RefundReason'
        amountPaid:
          $ref: '#/components/schemas/Paise'
        kitDeduction:
          $ref: '#/components/schemas/Paise'
        feeDeduction:
          $ref: '#/components/schemas/Paise'
          description: The ₹100 COD fee on COD orders (never refunded), else 0.
        amount:
          $ref: '#/components/schemas/Paise'
        method:
          $ref: '#/components/schemas/RefundMethod'
        destLast4:
          type: [string, 'null']
          minLength: 4
          maxLength: 4
          description: Last 4 of the UPI id / account number. Full details are never returned to the customer.
        destinationRequired:
          type: boolean
          description: True when this is a bank/UPI refund still waiting for the customer's details (PUT /orders/{id}/refund-destination).
        status:
          $ref: '#/components/schemas/RefundStatus'
        reference:
          type: [string, 'null']
          maxLength: 64
          description: Razorpay refund id or bank UTR, once paid.
        createdAt:
          type: string
          format: date-time
        paidAt:
          type: [string, 'null']
          format: date-time
    UpiDestination:
      type: object
      required: [type, upiId]
      properties:
        type:
          type: string
          const: upi
        upiId:
          type: string
          pattern: '^[\w.-]{2,}@[a-zA-Z]{2,}$'
    BankDestination:
      type: object
      required: [type, accountNo, ifsc, holder]
      properties:
        type:
          type: string
          const: bank
        accountNo:
          type: string
          pattern: '^\d{9,18}$'
        ifsc:
          type: string
          pattern: '^[A-Z]{4}0[A-Z0-9]{6}$'
        holder:
          type: string
          maxLength: 120
    RefundDestination:
      description: Where a COD refund is paid. Encrypted at rest (AES-256-GCM), purged 90 days after payment. Needs step-up OTP to set.
      oneOf:
        - $ref: '#/components/schemas/UpiDestination'
        - $ref: '#/components/schemas/BankDestination'
      discriminator:
        propertyName: type
        mapping:
          upi: '#/components/schemas/UpiDestination'
          bank: '#/components/schemas/BankDestination'
    InvoiceSummary:
      type: object
      description: Present once payment is received. Use GET /orders/{id}/invoice for the PDF link.
      required: [id, number, type, issuedAt, total, ready]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          maxLength: 16
          examples: [IDO/26-27/000001]
        type:
          type: string
          enum: [b2c, b2b]
        issuedAt:
          type: string
          format: date-time
        total:
          $ref: '#/components/schemas/Paise'
        ready:
          type: boolean
          description: PDF rendered (and, for B2B under e-invoicing, IRN entered). False → the download returns 409 INVOICE_NOT_READY.
    CreditNoteSummary:
      type: object
      required: [id, number, amount, issuedAt, ready]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          maxLength: 20
          examples: [IDOCN/26-27/000001]
        amount:
          $ref: '#/components/schemas/Paise'
        issuedAt:
          type: string
          format: date-time
        ready:
          type: boolean
    InvoiceLink:
      type: object
      required: [number, url, expiresAt]
      properties:
        number:
          type: string
        url:
          type: string
          format: uri
          description: Short-lived presigned S3 GET link to the PDF.
        expiresAt:
          type: string
          format: date-time
    ConsultWindow:
      type: object
      description: The 30-day consult window, set at the first ring delivery. Null before that.
      required: [startsAt, expiresAt, derm, dietician]
      properties:
        startsAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        derm:
          $ref: '#/components/schemas/EntitlementState'
        dietician:
          $ref: '#/components/schemas/EntitlementState'
    Order:
      type: object
      description: |
        The customer's view of an order (owner only). Money fields are paise.
        "Your ring is on its way back to us" = status ring_shipped and the latest ring shipment has status rto.
      required: [id, status, cancelReason, paymentMethod, finish, usSize, unitPrice, listPrice, subtotal, codFee, discount, total, amountPaid, kitPriceSnapshot, customer, address, shipments, refund, claim, invoice, creditNotes, consultWindow, sizeDueAt, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/OrderId'
        status:
          $ref: '#/components/schemas/OrderStatus'
        cancelReason:
          oneOf:
            - $ref: '#/components/schemas/CancelReason'
            - type: 'null'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        finish:
          $ref: '#/components/schemas/Finish'
        usSize:
          description: Null until the size is submitted; locked after.
          oneOf:
            - $ref: '#/components/schemas/UsSize'
            - type: 'null'
        unitPrice:
          $ref: '#/components/schemas/Paise'
        listPrice:
          $ref: '#/components/schemas/Paise'
        subtotal:
          $ref: '#/components/schemas/Paise'
        codFee:
          $ref: '#/components/schemas/Paise'
        discount:
          $ref: '#/components/schemas/Paise'
        total:
          $ref: '#/components/schemas/Paise'
        amountPaid:
          $ref: '#/components/schemas/Paise'
        kitPriceSnapshot:
          $ref: '#/components/schemas/Paise'
        offerCode:
          type: [string, 'null']
        customer:
          $ref: '#/components/schemas/Customer'
        address:
          $ref: '#/components/schemas/Address'
        buyerGstin:
          oneOf:
            - $ref: '#/components/schemas/Gstin'
            - type: 'null'
        buyerLegalName:
          type: [string, 'null']
          maxLength: 160
        kitDeliveredAt:
          type: [string, 'null']
          format: date-time
        sizeDueAt:
          type: [string, 'null']
          format: date-time
          description: 23:59:59 IST of (kit delivery date + 15 days). A reminder target, not a cut-off.
        sizeSubmittedAt:
          type: [string, 'null']
          format: date-time
        ringDeliveredAt:
          type: [string, 'null']
          format: date-time
        damageWindowUntil:
          type: [string, 'null']
          format: date-time
          description: Damaged / wrong-item claims allowed until this time (7 days after first ring delivery).
        warrantyUntil:
          type: [string, 'null']
          format: date-time
        cancelledAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        shipments:
          type: array
          items:
            $ref: '#/components/schemas/Shipment'
        refund:
          oneOf:
            - $ref: '#/components/schemas/Refund'
            - type: 'null'
        claim:
          description: The open (or most recent) replacement claim.
          oneOf:
            - $ref: '#/components/schemas/Claim'
            - type: 'null'
        invoice:
          oneOf:
            - $ref: '#/components/schemas/InvoiceSummary'
            - type: 'null'
        creditNotes:
          type: array
          items:
            $ref: '#/components/schemas/CreditNoteSummary'
        consultWindow:
          oneOf:
            - $ref: '#/components/schemas/ConsultWindow'
            - type: 'null'
    CreateOrderRequest:
      type: object
      required: [finish, paymentMethod, customer, address]
      properties:
        finish:
          $ref: '#/components/schemas/Finish'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        customer:
          $ref: '#/components/schemas/Customer'
        address:
          $ref: '#/components/schemas/Address'
        buyerGstin:
          description: Optional "GST number (business purchase)". Send together with buyerLegalName or not at all. Cannot be added after the invoice is issued.
          $ref: '#/components/schemas/Gstin'
        buyerLegalName:
          type: string
          minLength: 1
          maxLength: 160
        offerCode:
          type: string
          maxLength: 32
    RazorpayCheckout:
      type: object
      description: Pass to the Razorpay Checkout widget (order_id, amount, currency, key). Created with payment_capture=1.
      required: [id, amount, currency, keyId]
      properties:
        id:
          type: string
          examples: [order_PZ3k9Xc1AbCdEf]
        amount:
          $ref: '#/components/schemas/Paise'
        currency:
          type: string
          const: INR
        keyId:
          type: string
    CreateOrderResponse:
      type: object
      required: [order]
      properties:
        order:
          $ref: '#/components/schemas/Order'
        razorpay:
          description: Present for paymentMethod=online only.
          $ref: '#/components/schemas/RazorpayCheckout'
    PaymentVerifyRequest:
      type: object
      required: [razorpayOrderId, razorpayPaymentId, razorpaySignature]
      properties:
        razorpayOrderId:
          type: string
        razorpayPaymentId:
          type: string
        razorpaySignature:
          type: string
    SizeRequest:
      type: object
      required: [usSize, confirmed]
      properties:
        usSize:
          $ref: '#/components/schemas/UsSize'
        confirmed:
          type: boolean
          const: true
          description: Must be true — the customer saw "You're choosing US 9. This can't be changed later."
    CancelPreview:
      type: object
      required: [cancellable, refundPaise, kitPricePaise, codFeePaise, refundRoute]
      properties:
        cancellable:
          type: boolean
        refundPaise:
          $ref: '#/components/schemas/Paise'
        kitPricePaise:
          $ref: '#/components/schemas/Paise'
          description: Deducted when the kit was delivered.
        codFeePaise:
          $ref: '#/components/schemas/Paise'
          description: Deducted on COD orders (never refunded).
        refundRoute:
          type: string
          description: |
            razorpay — prepaid, refunded to the original payment.
            bank_or_upi — COD after kit delivery; ask for UPI/bank (step-up OTP first).
            none — nothing was paid (e.g. COD before kit delivery).
            rto_first — kit is in transit; the cancel becomes an RTO request and the result depends on whether the kit comes back.
          enum: [razorpay, bank_or_upi, none, rto_first]
    CancelRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Customer's own words; stored in the order timeline. The order's cancelReason becomes `customer`.
        destination:
          description: Required when refundRoute is bank_or_upi. Needs a step-up OTP.
          $ref: '#/components/schemas/RefundDestination'
    CancelResponse:
      type: object
      required: [outcome, order]
      x-decision: "v1.0.0 (20 Oct): cancel during kit_shipped returns outcome=rto_requested; the order stays kit_shipped until the kit is back."
      properties:
        outcome:
          type: string
          enum: [cancelled, rto_requested]
        order:
          $ref: '#/components/schemas/Order'
    ConsentRequest:
      type: object
      required: [version]
      properties:
        version:
          type: string
          maxLength: 16
          description: Wording version the customer agreed to.

    # ---------- claims ----------
    ClaimUpload:
      type: object
      required: [id, kind, contentType, sizeBytes, verifiedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [video, photo]
        contentType:
          type: string
          maxLength: 64
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 262144000
        verifiedAt:
          type: [string, 'null']
          format: date-time
          description: Set at submit when S3 HeadObject confirms the object exists.
        createdAt:
          type: string
          format: date-time
        downloadUrl:
          type: string
          format: uri
          description: Admin claim detail only — presigned GET, valid 10 minutes.
    Claim:
      type: object
      required: [id, orderId, shipmentId, kind, description, status, uploads, createdAt]
      properties:
        id:
          type: string
          format: uuid
        orderId:
          $ref: '#/components/schemas/OrderId'
        shipmentId:
          type: string
          format: uuid
          description: The delivered ring (or replacement) being claimed.
        kind:
          $ref: '#/components/schemas/ClaimKind'
        description:
          type: string
        status:
          $ref: '#/components/schemas/ClaimStatus'
        decisionNote:
          type: [string, 'null']
        uploads:
          type: array
          items:
            $ref: '#/components/schemas/ClaimUpload'
        createdAt:
          type: string
          format: date-time
        submittedAt:
          type: [string, 'null']
          format: date-time
        decidedAt:
          type: [string, 'null']
          format: date-time
    CreateClaimRequest:
      type: object
      required: [kind, description]
      properties:
        kind:
          $ref: '#/components/schemas/ClaimKind'
        description:
          type: string
          maxLength: 2000
    ClaimUploadRequest:
      type: object
      required: [kind, contentType, sizeBytes]
      properties:
        kind:
          type: string
          enum: [video, photo]
        contentType:
          type: string
          examples: [video/mp4]
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 262144000
          description: Max 250 MB per file. At most 1 video + 6 photos per claim.
    ClaimUploadTicket:
      type: object
      description: Browser uploads straight to S3 with a multipart/form-data POST to `url`, sending every entry of `fields` followed by `file`.
      required: [upload, url, fields, expiresAt]
      properties:
        upload:
          $ref: '#/components/schemas/ClaimUpload'
        url:
          type: string
          format: uri
        fields:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
          description: 15 minutes after issue.
    AdminClaimDetail:
      allOf:
        - $ref: '#/components/schemas/Claim'
        - type: object
          required: [orderFinish, orderUsSize, customer]
          properties:
            orderFinish:
              $ref: '#/components/schemas/Finish'
            orderUsSize:
              $ref: '#/components/schemas/UsSize'
              description: For wrong_item checks ("You ordered US 8 Gold").
            customer:
              $ref: '#/components/schemas/Customer'
            decidedBy:
              type: [string, 'null']
              format: uuid
    ClaimDecisionRequest:
      type: object
      required: [decision, note]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        note:
          type: string
          minLength: 1

    # ---------- consults ----------
    EntitlementSlot:
      type: object
      required: [entitlementId, type, state, startsAt, expiresAt, consultId]
      properties:
        entitlementId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/ConsultType'
        state:
          $ref: '#/components/schemas/EntitlementState'
        startsAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        consultId:
          type: [string, 'null']
          description: The active or completed consult using this entitlement.
    Entitlement:
      type: object
      description: One per ring-delivered order (1 dermatologist + 1 dietician within 30 days of first ring delivery).
      required: [orderId, ringDeliveredAt, expiresAt, derm, dietician]
      properties:
        orderId:
          $ref: '#/components/schemas/OrderId'
        ringDeliveredAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        derm:
          $ref: '#/components/schemas/EntitlementSlot'
        dietician:
          $ref: '#/components/schemas/EntitlementSlot'
    Consult:
      type: object
      required: [id, entitlementId, type, name, phone, email, appointmentDate, timeSlot, appointmentAt, concern, status, doctorName, meetingLink, createdAt]
      properties:
        id:
          type: string
          maxLength: 40
        entitlementId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/ConsultType'
        name:
          type: string
        phone:
          $ref: '#/components/schemas/Phone'
        email:
          type: string
          format: email
        appointmentDate:
          type: string
          format: date
          description: Requested day (`date` in request bodies).
        timeSlot:
          type: string
          maxLength: 8
          examples: ['10:00 AM']
        appointmentAt:
          type: [string, 'null']
          format: date-time
          description: Set by the partner on confirm.
        concern:
          type: string
        status:
          $ref: '#/components/schemas/ConsultStatus'
        doctorName:
          type: [string, 'null']
        meetingLink:
          type: [string, 'null']
        confirmedAt:
          type: [string, 'null']
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    CreateConsultRequest:
      type: object
      required: [entitlementId, date, timeSlot, name, phone, email]
      properties:
        entitlementId:
          type: string
          format: uuid
        date:
          type: string
          format: date
          description: YYYY-MM-DD, on or before the entitlement's expiresAt.
        timeSlot:
          type: string
          maxLength: 8
        concern:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          $ref: '#/components/schemas/Phone'
        email:
          type: string
          format: email
    RescheduleConsultRequest:
      type: object
      required: [date, timeSlot]
      properties:
        date:
          type: string
          format: date
        timeSlot:
          type: string
          maxLength: 8
    PartnerConsult:
      allOf:
        - $ref: '#/components/schemas/Consult'
        - type: object
          required: [orderId, windowExpiresAt]
          properties:
            orderId:
              $ref: '#/components/schemas/OrderId'
            windowExpiresAt:
              type: string
              format: date-time
    PartnerConfirmRequest:
      type: object
      required: [doctorName, appointmentAt]
      properties:
        doctorName:
          type: string
          minLength: 1
        meetingLink:
          type: string
        appointmentAt:
          type: string
          format: date-time
          description: Must not be after the entitlement's expiresAt (DATE_OUTSIDE_WINDOW).
    PartnerCompleteRequest:
      type: object
      properties:
        note:
          type: string
          description: e.g. "No-show" — a no-show is also COMPLETED.

    # ---------- admin ----------
    Payment:
      type: object
      required: [id, method, amount, currency, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        method:
          type: string
          enum: [razorpay, cod_cash]
        razorpayOrderId:
          type: [string, 'null']
        razorpayPaymentId:
          type: [string, 'null']
        amount:
          $ref: '#/components/schemas/Paise'
        currency:
          type: string
          const: INR
        status:
          type: string
          enum: [created, authorized, captured, failed]
        capturedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    OrderEvent:
      type: object
      required: [id, actorType, event, createdAt]
      properties:
        id:
          type: string
          description: bigserial, as a string.
        actorType:
          type: string
          enum: [customer, admin, system, webhook, partner]
        actorUserId:
          type: [string, 'null']
          format: uuid
        fromStatus:
          type: [string, 'null']
        toStatus:
          type: [string, 'null']
        event:
          type: string
          maxLength: 40
          examples: [status_changed, awb_added, cod_call, size_changed, refund_details_viewed, note]
        note:
          type: [string, 'null']
        meta:
          type: [object, 'null']
        createdAt:
          type: string
          format: date-time
    Notification:
      type: object
      required: [id, channel, template, recipient, status, attempts, createdAt]
      properties:
        id:
          type: string
          format: uuid
        channel:
          type: string
          enum: [sms, whatsapp, email]
        template:
          type: string
          maxLength: 64
        recipient:
          type: string
        status:
          type: string
          description: WhatsApp rows are `skipped` at launch (placeholder sender, TD-11).
          enum: [queued, sent, failed, skipped]
        attempts:
          type: integer
        nextAttemptAt:
          type: string
          format: date-time
        providerMsgId:
          type: [string, 'null']
        error:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
    AdminOrder:
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          required: [userId, stockReserved, codCallAttempts]
          properties:
            userId:
              type: [string, 'null']
              format: uuid
            stockReserved:
              type: boolean
              description: A ring of (finish, usSize) is reserved for this order; false after size submit = backorder.
            codConfirmSentAt:
              type: [string, 'null']
              format: date-time
            codConfirmedAt:
              type: [string, 'null']
              format: date-time
            codConfirmVia:
              oneOf:
                - $ref: '#/components/schemas/CodConfirmVia'
                - type: 'null'
            codCallAttempts:
              type: integer
              minimum: 0
              maximum: 2
            codCallDueAt:
              type: [string, 'null']
              format: date-time
            piiScrubbedAt:
              type: [string, 'null']
              format: date-time
    AdminOrderDetail:
      description: Everything about one order for the ops Order detail screen.
      allOf:
        - $ref: '#/components/schemas/AdminOrder'
        - type: object
          required: [payments, events, notifications, adminRefund]
          properties:
            payments:
              type: array
              items:
                $ref: '#/components/schemas/Payment'
            adminRefund:
              description: Same refund as `refund`, with the ops-only fields.
              oneOf:
                - $ref: '#/components/schemas/AdminRefund'
                - type: 'null'
            events:
              type: array
              description: Timeline, oldest first.
              items:
                $ref: '#/components/schemas/OrderEvent'
            notifications:
              type: array
              items:
                $ref: '#/components/schemas/Notification'
    AdminOrderListItem:
      type: object
      required: [id, status, cancelReason, paymentMethod, finish, usSize, total, amountPaid, customer, city, pin, createdAt, sizeDueAt]
      properties:
        id:
          $ref: '#/components/schemas/OrderId'
        status:
          $ref: '#/components/schemas/OrderStatus'
        cancelReason:
          oneOf:
            - $ref: '#/components/schemas/CancelReason'
            - type: 'null'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        finish:
          $ref: '#/components/schemas/Finish'
        usSize:
          oneOf:
            - $ref: '#/components/schemas/UsSize'
            - type: 'null'
        total:
          $ref: '#/components/schemas/Paise'
        amountPaid:
          $ref: '#/components/schemas/Paise'
        customer:
          $ref: '#/components/schemas/Customer'
        city:
          type: string
        pin:
          type: string
        sizeDueAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    AdminOrderPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminOrderListItem'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    CodQueueItem:
      type: object
      required: [orderId, status, customer, city, pin, total, codConfirmSentAt, codCallDueAt, codCallAttempts, createdAt]
      properties:
        orderId:
          $ref: '#/components/schemas/OrderId'
        status:
          $ref: '#/components/schemas/OrderStatus'
        cancelReason:
          oneOf:
            - $ref: '#/components/schemas/CancelReason'
            - type: 'null'
        customer:
          $ref: '#/components/schemas/Customer'
        city:
          type: string
        pin:
          type: string
        total:
          $ref: '#/components/schemas/Paise'
        codConfirmSentAt:
          type: [string, 'null']
          format: date-time
        codCallDueAt:
          type: [string, 'null']
          format: date-time
        codCallAttempts:
          type: integer
          minimum: 0
          maximum: 2
        codConfirmedAt:
          type: [string, 'null']
          format: date-time
        codConfirmVia:
          oneOf:
            - $ref: '#/components/schemas/CodConfirmVia'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
    FulfilmentItem:
      type: object
      required: [orderId, status, paymentMethod, finish, usSize, customer, city, pin, stockReserved]
      properties:
        orderId:
          $ref: '#/components/schemas/OrderId'
        status:
          $ref: '#/components/schemas/OrderStatus'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        finish:
          $ref: '#/components/schemas/Finish'
        usSize:
          oneOf:
            - $ref: '#/components/schemas/UsSize'
            - type: 'null'
        customer:
          $ref: '#/components/schemas/Customer'
        city:
          type: string
        pin:
          type: string
        stockReserved:
          type: boolean
        confirmedAt:
          type: [string, 'null']
          format: date-time
        kitDeliveredAt:
          type: [string, 'null']
          format: date-time
        sizeDueAt:
          type: [string, 'null']
          format: date-time
        sizeSubmittedAt:
          type: [string, 'null']
          format: date-time
        daysToSizeDue:
          type: [integer, 'null']
          description: awaiting_size view; red when < 3. Negative = overdue.
    FulfilmentList:
      type: object
      required: [view, items]
      properties:
        view:
          type: string
          enum: [kit_to_ship, awaiting_size, size_overdue, ring_to_ship, backorder]
        items:
          type: array
          items:
            $ref: '#/components/schemas/FulfilmentItem'
        groups:
          type: array
          description: backorder view only — grouped by finish and size for vendor orders.
          items:
            type: object
            required: [finish, usSize, count]
            properties:
              finish:
                $ref: '#/components/schemas/Finish'
              usSize:
                $ref: '#/components/schemas/UsSize'
              count:
                type: integer
    AdminRefund:
      allOf:
        - $ref: '#/components/schemas/Refund'
        - type: object
          required: [paymentMethod, customer, accountHolder]
          properties:
            paymentMethod:
              $ref: '#/components/schemas/PaymentMethod'
            customer:
              $ref: '#/components/schemas/Customer'
            accountHolder:
              type: [string, 'null']
              maxLength: 120
              description: Compare with customer.name before paying.
            requestedBy:
              type: [string, 'null']
              format: uuid
            processedBy:
              type: [string, 'null']
              format: uuid
            destPurgedAt:
              type: [string, 'null']
              format: date-time
    AdminRefundPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminRefund'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    AdminClaimPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Claim'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    AdminToday:
      type: object
      required: [counts, codCallDue, sizeOverdue, refundsToPay]
      properties:
        counts:
          type: object
          required: [codAwaitingReply, codCallDue, kitToShip, awaitingSize, sizeOverdue, ringToShip, backorder, ringsReturning, refundsRequested, claimsSubmitted, notificationsFailed]
          properties:
            codAwaitingReply:
              type: integer
            codCallDue:
              type: integer
            kitToShip:
              type: integer
            awaitingSize:
              type: integer
            sizeOverdue:
              type: integer
            ringToShip:
              type: integer
            backorder:
              type: integer
            ringsReturning:
              type: integer
              description: Ring shipments in rto not yet received back.
            refundsRequested:
              type: integer
            claimsSubmitted:
              type: integer
            notificationsFailed:
              type: integer
        codCallDue:
          type: array
          items:
            $ref: '#/components/schemas/CodQueueItem'
        sizeOverdue:
          type: array
          items:
            $ref: '#/components/schemas/FulfilmentItem'
        refundsToPay:
          type: array
          items:
            $ref: '#/components/schemas/AdminRefund'
    CreateShipmentRequest:
      type: object
      required: [kind, courier, awb]
      properties:
        kind:
          $ref: '#/components/schemas/ShipmentKind'
        courier:
          type: string
          maxLength: 32
        awb:
          type: string
          maxLength: 40
        trackingUrl:
          type: string
          format: uri
        serialNumber:
          type: string
          maxLength: 40
          description: Required for ring and replacement.
        claimId:
          type: string
          format: uuid
          description: Required for replacement (an approved claim).
    UpdateShipmentRequest:
      type: object
      required: [status, reason]
      properties:
        status:
          type: string
          enum: [delivered, rto, lost]
        deliveredAt:
          type: string
          format: date-time
          description: Required for delivered; ≤ now and ≥ shippedAt.
        codCollectedPaise:
          $ref: '#/components/schemas/Paise'
          description: COD kit delivered — must equal the order total.
        rtoReason:
          $ref: '#/components/schemas/RtoReason'
        reason:
          type: string
          description: Free-text note for the timeline.
    ShipmentReturnedRequest:
      type: object
      required: [condition, note]
      properties:
        condition:
          $ref: '#/components/schemas/ReturnCondition'
        note:
          type: string
    AdminSizeRequest:
      type: object
      required: [usSize, reason]
      properties:
        usSize:
          $ref: '#/components/schemas/UsSize'
        reason:
          type: string
          minLength: 1
    NoteRequest:
      type: object
      required: [note]
      properties:
        note:
          type: string
          minLength: 1
    NotifyRequest:
      type: object
      required: [template]
      properties:
        template:
          type: string
          maxLength: 64
          description: Template to (re)send to the customer, e.g. ido_kit_shipped.
          examples: [ido_kit_shipped]
    CodConfirmRequest:
      type: object
      required: [via]
      properties:
        via:
          type: string
          enum: [call, whatsapp_manual]
    CodCallRequest:
      type: object
      required: [outcome, note]
      properties:
        outcome:
          type: string
          description: confirmed → order confirmed; refused → cancelled(cod_unconfirmed); no_answer / wrong_number on call 2 → cancelled(cod_unconfirmed).
          enum: [confirmed, no_answer, wrong_number, refused]
        note:
          type: string
    RefundStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [processing, paid, rejected]
        reference:
          type: string
          maxLength: 64
          description: Razorpay refund id or UTR. Required for paid.
    Sku:
      type: object
      required: [id, kind, finish, usSize, onHand, reserved, available, active, updatedAt]
      properties:
        id:
          type: string
          maxLength: 32
        kind:
          type: string
          enum: [ring, kit]
        finish:
          oneOf:
            - $ref: '#/components/schemas/Finish'
            - type: 'null'
        usSize:
          oneOf:
            - $ref: '#/components/schemas/UsSize'
            - type: 'null'
        onHand:
          type: integer
          minimum: 0
        reserved:
          type: integer
          minimum: 0
        available:
          type: integer
          description: onHand − reserved.
        active:
          type: boolean
        updatedAt:
          type: string
          format: date-time
    SkuPatchRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [id]
            properties:
              id:
                type: string
              onHand:
                type: integer
                minimum: 0
                description: Cannot go below reserved.
              active:
                type: boolean
    Settings:
      type: object
      description: Settings as camelCase keys (DB keys are snake_case). Read-only keys are listed in `readOnly`.
      properties:
        ringPricePaise:
          $ref: '#/components/schemas/Paise'
        ringListPricePaise:
          $ref: '#/components/schemas/Paise'
        kitPricePaise:
          type: [integer, 'null']
          description: Launch gate — orders return STORE_NOT_LIVE while null.
        codEnabled:
          type: boolean
        codFeePaise:
          $ref: '#/components/schemas/Paise'
        codPincodeMode:
          type: string
          description: Seeded 'all' (every pincode).
        codPincodes:
          type: array
          items:
            type: string
        maxRingsPerOrder:
          type: integer
        sizeWindowDays:
          type: integer
        consultWindowDays:
          type: integer
        replacementWindowDays:
          type: integer
        warrantyMonths:
          type: integer
        codReplyTimeoutHours:
          type: integer
        codMaxCallAttempts:
          type: integer
        sizeReminderDays:
          type: array
          items:
            type: integer
        pendingPaymentTtlHours:
          type: integer
        staffSessionHours:
          type: integer
        stepUpMinutes:
          type: integer
        invoicePrefix:
          type: string
        creditNotePrefix:
          type: string
        hsnCode:
          type: [string, 'null']
        gstRateBp:
          type: integer
          description: Basis points; 1800 = 18%.
        refundFullBeforeKitShip:
          type: boolean
        kitRtoRefundFull:
          type: boolean
        launchOffer:
          type: object
          properties:
            enabled:
              type: boolean
            kind:
              type: [string, 'null']
            amountPaise:
              $ref: '#/components/schemas/Paise'
            code:
              type: [string, 'null']
        socialProofEnabled:
          type: boolean
        defaultCourier:
          type: string
        supportHours:
          type: object
          properties:
            days:
              type: string
            open:
              type: string
            close:
              type: string
        consultHours:
          type: object
          properties:
            open:
              type: string
            close:
              type: string
        seller:
          type: object
          properties:
            legalName:
              type: string
            gstin:
              type: [string, 'null']
            cin:
              type: [string, 'null']
            state:
              type: [string, 'null']
            address:
              type: [string, 'null']
        supportContacts:
          type: object
          properties:
            email:
              type: [string, 'null']
            phone:
              type: [string, 'null']
            whatsapp:
              type: [string, 'null']
        launchAt:
          type: [string, 'null']
          format: date-time
    SettingsResponse:
      type: object
      required: [settings, readOnly, launchGate]
      properties:
        settings:
          $ref: '#/components/schemas/Settings'
        readOnly:
          type: array
          description: camelCase keys that PATCH refuses (SETTING_READ_ONLY).
          items:
            type: string
        launchGate:
          type: object
          description: POST /orders is open only when every item is set (ring price, kit price, GSTIN, HSN, seller state, support contacts).
          required: [live, missing]
          properties:
            live:
              type: boolean
            missing:
              type: array
              items:
                type: string
    StepUpResponse:
      type: object
      required: [stepUpUntil]
      properties:
        stepUpUntil:
          type: string
          format: date-time
        accessToken:
          type: string
          description: App only — a new access token carrying the step-up claim.
