  # =====================================================================
  # Customer — orders, payment, size, cancel, invoices
  # =====================================================================
  /orders:
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Place an order (one ring; sizing kit included)
      description: |
        The server re-quotes from settings (the client sends no prices). `online` → order `pending_payment` plus a Razorpay
        order (payment_capture=1) to open Checkout with. `cod` → order `cod_pending` (ops confirm by phone/WhatsApp; total incl.
        ₹100 fee is paid in full when the sizing kit is delivered).
        Same `Idempotency-Key` again → the same order (200) — use this after "Payment not completed. Try again".
      x-lld: C
      security:
        - customerCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            examples:
              online:
                value:
                  finish: gold
                  paymentMethod: online
                  customer:
                    name: Ananya Sharma
                    email: ananya.sharma@example.com
                    phone: '9800000001'
                  address:
                    line: Flat 4B, Example Residency, Sector 21
                    city: Gurugram
                    state: Haryana
                    pin: '122001'
              b2b:
                value:
                  finish: black
                  paymentMethod: online
                  customer:
                    name: Ananya Sharma
                    email: ananya.sharma@example.com
                    phone: '9800000001'
                  address:
                    line: Flat 4B, Example Residency, Sector 21
                    city: Gurugram
                    state: Haryana
                    pin: '122001'
                  buyerGstin: 06ABCDE1234F1Z5
                  buyerLegalName: Example Traders Pvt. Ltd.
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
              examples:
                online:
                  $ref: '#/components/examples/CreateOrderOnline'
        '200':
          description: Idempotent replay — the order already created with this Idempotency-Key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
              examples:
                online:
                  $ref: '#/components/examples/CreateOrderOnline'
        '400':
          description: Validation failed or invalid GSTIN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                GSTIN_INVALID:
                  value:
                    statusCode: 400
                    message: That GST number doesn't look right.
                    code: GSTIN_INVALID
                VALIDATION_FAILED:
                  value:
                    statusCode: 400
                    message: ['pin must be exactly 6 digits']
                    code: VALIDATION_FAILED
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: COD not available for this pincode (or COD switched off).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                COD_NOT_SERVICEABLE:
                  value:
                    statusCode: 409
                    message: Cash on Delivery isn't available for this pincode. Please pay online.
                    code: COD_NOT_SERVICEABLE
        '503':
          description: Launch gate closed (prices, kit price, GSTIN, HSN, seller state or support contacts not set).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                STORE_NOT_LIVE:
                  value:
                    statusCode: 503
                    message: The store isn't open yet.
                    code: STORE_NOT_LIVE
