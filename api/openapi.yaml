openapi: 3.1.0
info:
  title: i do website API
  version: 1.0.0
  summary: Backend contract for idowellness.ai (shop, account, ops dashboard), LLD v1.4 FINAL.
  description: |
    The agreed contract between i_Do_Backend (NestJS) and the i do website / ops dashboard.
    Built from LLD v1.4 FINAL (16 Oct 2026) section 5 plus the shipped schema (migrations M13–M20).
    Changes go through the Dev Sync "API contract changes" log first.

    **Conventions**
    - JSON field names are camelCase (DB `us_size` → `usSize`, `size_due_at` → `sizeDueAt`).
    - Every money field is an **integer number of paise** (₹14,999 = `1499900`). Field names follow the
      LLD / shipped entities: a `Paise` suffix appears only where the LLD names it that way
      (`pricePaise`, `refundPaise`, `codCollectedPaise` …); order and refund columns keep their entity
      names (`total`, `codFee`, `amountPaid`, `amount`) and are paise too. The client never sends a price.
    - Timestamps are ISO-8601 with offset (`2026-11-14T23:59:59+05:30`); calendar dates are `YYYY-MM-DD`.
    - Errors always have the shape `{statusCode, message, code}`; switch on `code`, never on `message`.
    - Every state-changing request (POST/PUT/PATCH/DELETE) must send `X-Requested-With: ido`
      (CSRF guard); the API also checks an exact CORS allow-list (www, ops).
    - `POST /orders` needs an `Idempotency-Key` (UUID). Retrying with the same key returns the same order.
    - Auth per audience: website = HttpOnly cookies `ido_at`/`ido_rt` (send with `credentials: 'include'`);
      app = `Authorization: Bearer`; ops dashboard = cookies `ido_ops_at`/`ido_ops_rt` (JWT aud=ops,
      `/admin/*` only, Origin must be https://ops.idowellness.ai); partner app = `x-api-key`.
    - Owner-only resources (orders, claims, consults) return 404 to anyone else.
    - Paginated lists return `{items, page, pageSize, total}` (page is 1-based).
  contact:
    name: i do backend (Mithilesh)
  license:
    name: Proprietary — Misya Beauty Tech Pvt. Ltd.
    identifier: LicenseRef-Proprietary
servers:
  - url: https://test-api.idowellness.ai
    description: test
  - url: https://api.idowellness.ai
    description: prod (from 29 Oct 2026)
  - url: http://localhost:3001
    description: local
  - url: http://127.0.0.1:4010
    description: Prism mock (npx @stoplight/prism-cli mock api/openapi.yaml)
tags:
  - name: Public
    description: No login needed.
  - name: Auth
    description: Customer and staff login, refresh, step-up OTP, account.
  - name: Orders
    description: Placing and reading the customer's own orders.
  - name: Payments
    description: Razorpay checkout verification.
  - name: Size
    description: One-time ring size submission (locks on submit).
  - name: Cancel & refunds
    description: Customer cancel preview, cancel and refund destination.
  - name: Invoices
    description: GST invoice and credit-note PDF links (owner only).
  - name: Consents
    description: Health-data consent (DPDP, TD-25).
  - name: Claims
    description: Replacement claims with video/photo uploads (due by L+10).
  - name: Consults
    description: Consult entitlements and bookings (due by L+10).
  - name: Partner
    description: partner-app-server endpoints (x-api-key).
  - name: Admin
    description: Ops dashboard (ops.idowellness.ai). Staff cookies with aud=ops. Every endpoint carries a permission tag (TD-27); any staff member passes for now.
  - name: Webhooks
    description: Server-to-server callbacks. Not called by the website.
paths:
  # =====================================================================
  # Public
  # =====================================================================
  /health:
    get:
      tags: [Public]
      operationId: getHealth
      security: []
      summary: Liveness check
      x-lld: K
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp]
                properties:
                  status:
                    type: string
                    const: ok
                  timestamp:
                    type: string
                    format: date-time
              examples:
                ok:
                  $ref: '#/components/examples/Health'
  /catalog:
    get:
      tags: [Public]
      operationId: getCatalog
      security: []
      summary: Price, finishes and the read-only size grid for /shop
      description: All prices come from server settings. Sizes are informational only (the customer picks a size later, from the kit).
      x-lld: N
      responses:
        '200':
          description: Catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
              examples:
                catalog:
                  $ref: '#/components/examples/Catalog'
  /orders/quote:
    post:
      tags: [Public]
      operationId: quoteOrder
      security: []
      summary: Server-computed totals for cart and checkout
      description: Display only; the client never sends a price. COD adds the ₹100 fee (codFee 10000).
      x-lld: N
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
            example:
              finish: gold
              paymentMethod: online
              pin: '122001'
      responses:
        '200':
          description: Quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
              examples:
                online:
                  $ref: '#/components/examples/QuoteOnline'
                cod:
                  $ref: '#/components/examples/QuoteCod'
        '400':
          $ref: '#/components/responses/ValidationFailed'
  /contact:
    post:
      tags: [Public]
      operationId: sendContact
      security: []
      summary: Contact form (emails support)
      x-lld: K
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, message]
              properties:
                name:
                  type: string
                  maxLength: 120
                email:
                  type: string
                  format: email
                message:
                  type: string
                  maxLength: 4000
      responses:
        '201':
          description: Sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Thanks — we'll get back to you soon.
        '400':
          $ref: '#/components/responses/ValidationFailed'
  /newsletter/subscribe:
    post:
      tags: [Public]
      operationId: subscribeNewsletter
      security: []
      summary: Newsletter signup
      x-lld: K
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '201':
          description: Subscribed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: You're subscribed — welcome to The Circle.
        '400':
          $ref: '#/components/responses/ValidationFailed'

  # =====================================================================
  # Auth
  # =====================================================================
  /auth/phone/send-otp:
    post:
      tags: [Auth]
      operationId: sendPhoneOtp
      security: []
      summary: Send a login OTP (SMS; WhatsApp copy while enabled)
      description: Rate limits — 1 per 30 s and 5 per hour per phone, 20 per hour per IP. Also used to get the OTP for POST /auth/step-up.
      x-lld: C
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  $ref: '#/components/schemas/Phone'
            example:
              phone: '9800000001'
      responses:
        '201':
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: A verification code has been sent to your phone.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          description: Too many OTP requests.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                OTP_RATE_LIMIT:
                  value:
                    statusCode: 429
                    message: Please wait 30 seconds before asking for another code.
                    code: OTP_RATE_LIMIT
  /auth/phone/verify-otp:
    post:
      tags: [Auth]
      operationId: verifyPhoneOtp
      security: []
      summary: Log in / sign up with the OTP
      description: Sets `ido_at` + `ido_rt` cookies (website) or returns tokens in the body (app, `X-Client app`). 5 wrong attempts burn the code.
      x-lld: C
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
        - $ref: '#/components/parameters/XClient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone:
                  $ref: '#/components/schemas/Phone'
                code:
                  type: string
                  pattern: '^\d{6}$'
                fullName:
                  type: string
                  maxLength: 120
                  description: Used only when this phone has no account yet.
            example:
              phone: '9800000001'
              code: '123456'
              fullName: Ananya Sharma
      responses:
        '200':
          description: Logged in
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieCustomer'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              examples:
                web:
                  $ref: '#/components/examples/AuthSessionWeb'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: Wrong, expired or burned code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                OTP_INVALID:
                  value:
                    statusCode: 401
                    message: That code is invalid or has expired.
                    code: OTP_INVALID
  /auth/email/send-otp:
    post:
      tags: [Auth]
      operationId: sendEmailOtp
      security: []
      summary: Send a login OTP by email (passwordless; works for a new or an existing address)
      description: |
        Passwordless email login, the email twin of `/auth/phone/send-otp`. The response never says whether an account
        exists. Any code still outstanding for this address is invalidated. Code valid 10 minutes.
        Rate limits: 1 per 30 s and 5 per hour per address, 20 per hour per IP.
      x-lld: N
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                  description: Trimmed and lower-cased by the server.
            example:
              email: ananya.sharma@example.com
      responses:
        '201':
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: A verification code has been sent to your email.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          description: Too many OTP requests.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                OTP_RATE_LIMIT:
                  value:
                    statusCode: 429
                    message: Please wait 30 seconds before asking for another code.
                    code: OTP_RATE_LIMIT
  /auth/email/verify-otp:
    post:
      tags: [Auth]
      operationId: verifyEmailOtp
      security: []
      summary: Log in / sign up with the emailed OTP
      description: |
        The email twin of `/auth/phone/verify-otp`. Creates the account on first verify (no password), marks the email
        verified, and sets `ido_at` + `ido_rt` cookies (website) or returns tokens in the body (app, `X-Client app`).
        5 wrong attempts burn the code.
      x-lld: N
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
        - $ref: '#/components/parameters/XClient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                code:
                  type: string
                  pattern: '^\d{6}$'
                fullName:
                  type: string
                  maxLength: 120
                  description: Used only when this email has no account yet.
            example:
              email: ananya.sharma@example.com
              code: '123456'
              fullName: Ananya Sharma
      responses:
        '200':
          description: Logged in
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieCustomer'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              examples:
                web:
                  $ref: '#/components/examples/AuthSessionWeb'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: Wrong, expired or burned code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                OTP_INVALID:
                  value:
                    statusCode: 401
                    message: That code is invalid or has expired.
                    code: OTP_INVALID
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      security: []
      summary: Email + password signup (unchanged body, cookie transport)
      x-lld: C
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
        - $ref: '#/components/parameters/XClient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                fullName:
                  type: string
                  maxLength: 120
      responses:
        '201':
          description: Account created
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieCustomer'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              examples:
                web:
                  $ref: '#/components/examples/AuthSessionWeb'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          description: Email already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                EMAIL_IN_USE:
                  value:
                    statusCode: 409
                    message: An account with this email already exists.
                    code: EMAIL_IN_USE
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      summary: Email + password login (unchanged body, cookie transport)
      x-lld: C
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
        - $ref: '#/components/parameters/XClient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Logged in
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieCustomer'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              examples:
                web:
                  $ref: '#/components/examples/AuthSessionWeb'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      security: []
      summary: Email a password-reset link (existing, unchanged)
      description: Exists in the shipped backend; not listed in LLD §5 and not changed by it.
      x-lld: K
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '201':
          description: Always the same answer (no account enumeration).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: If an account exists for that email, we've sent a reset link.
        '400':
          $ref: '#/components/responses/ValidationFailed'
  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      security: []
      summary: Set a new password from the reset link (existing, unchanged)
      x-lld: K
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
      responses:
        '201':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Your password has been reset — you can now log in.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/verify-email:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Confirm the 6-digit email code (existing, unchanged)
      x-lld: K
      security:
        - customerCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  pattern: '^\d{6}$'
      responses:
        '201':
          description: Verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Your email is verified.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/resend-verification:
    post:
      tags: [Auth]
      operationId: resendVerification
      summary: Resend the email verification code (existing, unchanged)
      x-lld: K
      security:
        - customerCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '201':
          description: Sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: A new verification code has been sent to your email.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Rotate the refresh token and issue a new access token
      description: |
        Website: sends the `ido_rt` cookie (Path=/auth) automatically; new cookies come back.
        Ops: the same call with `ido_ops_rt` returns new ops cookies.
        App: send `{refreshToken}` in the body with `X-Client: app`.
        Reusing an already-rotated refresh token revokes the whole token family (401).
      x-lld: N
      x-decision: "v1.0.0 (20 Oct): staff refresh and logout use the shared /auth/refresh and /auth/logout with ido_ops_rt; the app sends its refresh token in the body (refreshToken)."
      security:
        - customerRefreshCookie: []
        - opsRefreshCookie: []
        - {}
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
        - $ref: '#/components/parameters/XClient'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: App only.
      responses:
        '200':
          description: Rotated
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieCustomer'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              examples:
                web:
                  $ref: '#/components/examples/AuthSessionWeb'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the refresh token and clear cookies
      x-lld: N
      security:
        - customerRefreshCookie: []
        - opsRefreshCookie: []
        - {}
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: App only.
      responses:
        '204':
          description: Logged out (cookies cleared). Always 204, even without a session.
  /auth/admin/send-otp:
    post:
      tags: [Auth]
      operationId: adminSendOtp
      security: []
      summary: Staff login — send OTP (allow-listed phones only)
      description: Any number that is not a staff user (role admin) gets 403 NOT_STAFF and no OTP is sent. Same rate limits as customer OTP.
      x-lld: N
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  $ref: '#/components/schemas/Phone'
            example:
              phone: '9800000009'
      responses:
        '201':
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: A verification code has been sent to your phone.
        '403':
          description: Not a staff number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NOT_STAFF:
                  value:
                    statusCode: 403
                    message: This number is not registered for ops access.
                    code: NOT_STAFF
        '429':
          description: Too many OTP requests.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                OTP_RATE_LIMIT:
                  value:
                    statusCode: 429
                    message: Please wait 30 seconds before asking for another code.
                    code: OTP_RATE_LIMIT
  /auth/admin/verify-otp:
    post:
      tags: [Auth]
      operationId: adminVerifyOtp
      security: []
      summary: Staff login — verify OTP, get ops cookies (aud=ops, 12 h)
      x-lld: N
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone:
                  $ref: '#/components/schemas/Phone'
                code:
                  type: string
                  pattern: '^\d{6}$'
      responses:
        '200':
          description: Logged in to ops
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieOps'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              examples:
                staff:
                  $ref: '#/components/examples/AuthSessionStaff'
        '401':
          description: Wrong, expired or burned code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                OTP_INVALID:
                  value:
                    statusCode: 401
                    message: That code is invalid or has expired.
                    code: OTP_INVALID
        '403':
          description: Not a staff number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NOT_STAFF:
                  value:
                    statusCode: 403
                    message: This number is not registered for ops access.
                    code: NOT_STAFF
  /auth/step-up:
    post:
      tags: [Auth]
      operationId: stepUp
      summary: Fresh OTP to unlock sensitive actions for 15 minutes
      description: |
        Needed before sending refund bank/UPI details (customer) or revealing them (staff).
        First request an OTP for the account's own phone (POST /auth/phone/send-otp, or /auth/admin/send-otp for staff),
        then send the code here. The new access cookie (or app token) carries the step-up claim.
      x-lld: N
      x-decision: "v1.0.0 (20 Oct): the step-up OTP is sent with the normal send-otp route (/auth/phone/send-otp, staff /auth/admin/send-otp); the step-up claim is valid 15 min (TD-20, settings step_up_minutes)."
      security:
        - customerCookie: []
        - bearerAuth: []
        - opsCookie: []
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  pattern: '^\d{6}$'
      responses:
        '200':
          description: Step-up granted
          headers:
