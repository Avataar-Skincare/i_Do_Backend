  /admin/orders/{id}/shipments:
    post:
      tags: [Admin]
      operationId: adminCreateShipment
      summary: Ship the kit, ring or replacement (enters AWB; status shipped)
      description: |
        kind=kit: confirmed → kit_shipped (kit on_hand −1; COD codAmount = total).
        kind=ring: size_submitted → ring_shipped (needs serialNumber and stock of the order's finish+size; on_hand −1, reserved −1). Also used for attempt 2 after an undeliverable RTO.
        kind=replacement: needs an approved claimId and serialNumber; never changes the order status.
        Failing guards (no stock, wrong status) → 409 INVALID_TRANSITION.
      x-permission: shipments.create
      security:
        - opsCookie: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShipmentRequest'
            example:
              kind: kit
              courier: shiprocket
              awb: SR0000000101
              trackingUrl: https://shiprocket.co/tracking/SR0000000101
      responses:
        '201':
          description: Shipment created; returns the updated order detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrderDetail'
              examples:
                detail:
                  $ref: '#/components/examples/AdminOrderDetail'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
  /admin/shipments/{id}:
    patch:
      tags: [Admin]
      operationId: adminUpdateShipment
      summary: Mark a shipment delivered, RTO or lost
      description: |
        Kit delivered → kit_delivered (COD: codCollectedPaise must equal total; invoice issued). Kit rto → cancelled(kit_rto).
        Ring delivered (first) → ring_delivered (warranty, entitlements). Ring rto → order stays ring_shipped (no refund until
        POST /admin/shipments/{id}/returned). Replacement delivered → claim replaced.
      x-permission: shipments.update
      security:
        - opsCookie: []
      parameters:
        - $ref: '#/components/parameters/ShipmentId'
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShipmentRequest'
            examples:
              codKitDelivered:
                value:
                  status: delivered
                  deliveredAt: '2026-10-24T14:05:00+05:30'
                  codCollectedPaise: 1509900
                  reason: Delivered, cash collected per courier
              ringRefused:
                value:
                  status: rto
                  rtoReason: refused
                  reason: Customer refused at the door
      responses:
        '200':
          description: Updated; returns the order detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrderDetail'
              examples:
                detail:
                  $ref: '#/components/examples/AdminOrderDetail'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
  /admin/shipments/{id}/returned:
    post:
      tags: [Admin]
      operationId: adminShipmentReturned
      summary: Record an RTO parcel received back at the warehouse
      description: |
        Sets returnedAt + returnCondition. Sealed ring → on_hand +1. A refused (or failed attempt-2) ring fires transition 15:
        cancelled(ring_refused) and the refund is created (requested; amountPaid − kit price, − ₹100 on COD) with its credit note.
        An undeliverable attempt-1 ring becomes ready for attempt 2. A damaged return goes to ops review before any refund.
      x-permission: shipments.returned
      x-decision: "v1.0.0 (20 Oct): ops approve or reject via an admin refund action added with the refunds work (week 2); the website is not affected."
      security:
        - opsCookie: []
      parameters:
        - $ref: '#/components/parameters/ShipmentId'
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentReturnedRequest'
            example:
              condition: sealed
              note: Seal intact, box undamaged
      responses:
        '200':
          description: Recorded; returns the order detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrderDetail'
              examples:
                detail:
                  $ref: '#/components/examples/AdminOrderDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
