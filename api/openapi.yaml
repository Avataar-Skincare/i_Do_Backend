  /orders/{id}/payment/verify:
    post:
      tags: [Payments]
      operationId: verifyPayment
      summary: Verify the Razorpay Checkout result
      description: |
        Call with the handler response from Razorpay Checkout. Returns the order: `confirmed` when captured, still
        `pending_payment` when only authorized (keep polling GET /orders/{id}). The webhook is the source of truth either way.
      x-lld: N
      security:
        - customerCookie: []
        - bearerAuth: []
